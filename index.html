<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امیرمحمد پروین‌آذر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* فونت ایران‌یکان: فایل فونت را کنار این فایل بگذارید و خط زیر را فعال کنید */
/* @font-face{font-family:'IRANYekan';src:url('IRANYekan.woff2') format('woff2');font-weight:400 800} */
:root{
  --bg:#fbfbfd;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --green:#8fd6b0;--green-d:#2f8f63;--green-soft:#e6f6ec;--ink-on-green:#0e3b27;
  --shadow:0 20px 50px -20px rgba(20,60,40,.25);
}
[data-theme=dark]{
  --bg:#000;--card:#161617;--text:#f5f5f7;--muted:#a1a1a6;--line:#333336;
  --green:#8fd6b0;--green-d:#8fd6b0;--green-soft:#10201a;--ink-on-green:#06251a;
  --shadow:0 20px 60px -20px rgba(143,214,176,.18);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font-family:'IRANYekan','Iranyekan','Vazirmatn','Inter',system-ui,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
html[lang=en] body{font-family:'Inter','IRANYekan',system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:24px}

nav{position:fixed;inset:0 0 auto;z-index:20;backdrop-filter:saturate(180%) blur(20px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
nav ul{display:flex;gap:26px;list-style:none;font-size:13px;color:var(--muted)}
nav ul a:hover{color:var(--text)}
.tools{display:flex;gap:8px}
.btn-i{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:980px;height:32px;min-width:32px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer;transition:background .2s}
.btn-i:hover{background:var(--green-soft)}
@media(max-width:700px){nav ul{display:none}}

.hero{min-height:100vh;display:grid;align-items:center;padding:110px 0 70px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero h1 span{display:block;background:linear-gradient(100deg,var(--green-d),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:22px;font-size:clamp(17px,2vw,22px);color:var(--muted);max-width:30ch}
.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-block;border-radius:980px;padding:11px 24px;font-size:16px;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn.p{background:var(--green);color:var(--ink-on-green)}
.btn.s{border:1px solid var(--green-d);color:var(--green-d)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.load{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.load.d2{animation-delay:.15s}.load.d3{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}

.stage{perspective:1100px;height:420px;display:grid;place-items:center}
.stack{position:relative;width:260px;height:340px;transform-style:preserve-3d;transition:transform .15s ease-out;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-18deg))}
.layer{position:absolute;inset:0;border-radius:32px;border:1px solid color-mix(in srgb,var(--green) 55%,transparent)}
.l1{transform:translateZ(-80px);background:var(--green-soft)}
.l2{transform:translateZ(-30px);background:linear-gradient(160deg,color-mix(in srgb,var(--green) 55%,transparent),transparent);backdrop-filter:blur(10px)}
.l3{transform:translateZ(30px);background:linear-gradient(150deg,#b9ecd0,#6fc79a);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink-on-green);font-weight:800;font-size:64px;font-family:'Inter',sans-serif;letter-spacing:-.04em}
.chip{position:absolute;padding:7px 15px;border-radius:980px;background:var(--card);border:1px solid var(--line);font:600 13px 'Inter',sans-serif;box-shadow:var(--shadow);animation:float 6s ease-in-out infinite}
.c1{top:6%;inset-inline-start:-50px;transform:translateZ(110px)}
.c2{top:38%;inset-inline-end:-60px;transform:translateZ(150px);animation-delay:-2s}
.c3{bottom:20%;inset-inline-start:-36px;transform:translateZ(90px);animation-delay:-4s}
.c4{bottom:4%;inset-inline-end:-30px;transform:translateZ(130px);animation-delay:-1s}
@keyframes float{50%{margin-top:-12px}}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}.stage{height:360px;order:-1}.hero{padding-top:90px}}

section{padding:96px 0}
.alt{background:color-mix(in srgb,var(--green-soft) 55%,var(--bg))}
h2{font-size:clamp(30px,4.5vw,52px);font-weight:800;line-height:1.2;letter-spacing:-.015em;margin-bottom:28px}
.lead{font-size:clamp(18px,2.2vw,26px);max-width:34ch;line-height:1.7}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:start}
.facts{display:grid;gap:14px}
.fact{background:var(--card);border-radius:22px;padding:20px 24px;border:1px solid var(--line)}
.fact b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.fact span{font-size:18px;font-weight:600}
@media(max-width:800px){.about{grid-template-columns:1fr}}

.skills{display:flex;flex-wrap:wrap;gap:12px}
.skill{background:var(--card);border:1px solid var(--line);border-radius:980px;padding:12px 24px;font-size:18px;font-weight:600;transition:transform .2s,border-color .2s}
.skill:hover{transform:translateY(-4px);border-color:var(--green)}

.projects{display:grid;gap:28px}
.proj{display:grid;grid-template-columns:1.1fr 1fr;background:var(--card);border-radius:32px;border:1px solid var(--line);overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s;will-change:transform}
.proj:hover{box-shadow:var(--shadow)}
.shot{min-height:260px;position:relative;background:linear-gradient(135deg,var(--green-soft),color-mix(in srgb,var(--green) 40%,var(--card)));display:grid;place-items:center;overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph{font:600 15px inherit;color:var(--green-d);opacity:.8;text-align:center;padding:20px}
.shot .win{width:70%;aspect-ratio:16/10;background:var(--card);border-radius:14px;box-shadow:var(--shadow);transform:translateZ(40px) rotateY(-10deg) rotateX(6deg);padding:12px}
.win i{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:8px}
.win i:first-child{width:35%;background:var(--green)}
.win i:nth-child(3){width:70%}
.pbody{padding:36px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pbody h3{font-size:26px;line-height:1.3}
.pbody p{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;background:var(--green-soft);color:var(--green-d);padding:3px 12px;border-radius:980px;font-weight:600}
.pbody a{color:var(--green-d);font-weight:600;margin-top:6px}
.slider .sl{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.slider .sl.on{opacity:1}
.sb{position:absolute;top:50%;translate:0 -50%;z-index:2;width:36px;height:36px;border:0;border-radius:50%;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(8px);color:var(--text);font-size:22px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
.single .sb,.single .dots{display:none}
.sb.prev{inset-inline-start:12px}.sb.next{inset-inline-end:12px}
html[dir=rtl] .sb span{display:inline-block;transform:scaleX(-1)}
.dots{position:absolute;bottom:12px;inset-inline:0;display:flex;justify-content:center;gap:7px;z-index:2}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--text) 30%,transparent);cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:22px;border-radius:4px;background:var(--green-d)}
@media(max-width:800px){.proj{grid-template-columns:1fr}}

.tl{border-inline-start:2px solid var(--green);padding-inline-start:28px;max-width:640px}
.tl h3{font-size:22px}.tl p{color:var(--muted)}

.contact{text-align:center}
.contact .lead{margin-inline:auto}
.contact .cta{justify-content:center}
footer{padding:36px 0 calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:13px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

    </div>
  </div>
</div></section>

<section id="skills"><div class="wrap">
  <h2 data-i18n="skills_t"></h2>

const $=s=>document.querySelector(s),root=document.documentElement;
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function setLang(l){root.lang=l;root.dir=l==='fa'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>{const v=T[l][e.dataset.i18n];if(v!=null)e.textContent=v});
  $('#lang').textContent=T[l].lang;document.title=T[l].h_name;set('lang',l);}
function setTheme(t){root.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀':'☾';set('theme',t);}
$('#lang').onclick=()=>setLang(root.lang==='fa'?'en':'fa');
$('#theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
setLang(get('lang')||'fa');
setTheme(get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

// image sliders (arrows, dots, swipe, autoplay)
document.querySelectorAll('.slider').forEach(s=>{
  const sl=[...s.querySelectorAll('.sl')],dots=s.querySelector('.dots');let i=0,t;
  sl.forEach((_,k)=>{const b=document.createElement('button');b.setAttribute('aria-label',k+1);b.onclick=()=>go(k,1);dots.append(b)});
  function go(n,manual){i=(n+sl.length)%sl.length;sl.forEach((e,k)=>e.classList.toggle('on',k===i));
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));if(manual)restart()}
  function restart(){clearInterval(t);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)t=setInterval(()=>go(i+1),4500)}
  s.querySelector('.prev').onclick=()=>go(i-1,1);s.querySelector('.next').onclick=()=>go(i+1,1);
  s.addEventListener('pointerenter',()=>clearInterval(t));s.addEventListener('pointerleave',restart);
  let x0=null;s.addEventListener('pointerdown',e=>x0=e.clientX);
  s.addEventListener('pointerup',e=>{if(x0==null)return;const d=(e.clientX-x0)*(root.dir==='rtl'?-1:1);x0=null;if(Math.abs(d)>40)go(i+(d<0?1:-1),1)});
  go(0);restart();
});

// 3D: hero stack follows pointer, project cards tilt on hover
const stack=$('#stack'),stage=$('#stage');
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();
  stack.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*50+'deg');
  stack.style.setProperty('--rx',(-((e.clientY-r.top)/r.height-.5))*36+'deg')});
stage.addEventListener('pointerleave',()=>{stack.style.setProperty('--ry','-18deg');stack.style.setProperty('--rx','8deg')});
document.querySelectorAll('.tilt').forEach(c=>{
  c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=c.getBoundingClientRect();
    c.style.transform=`perspective(1000px) rotateY(${((e.clientX-r.left)/r.width-.5)*6}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*6}deg)`});
  c.addEventListener('pointerleave',()=>c.style.transform='')});
</script>
